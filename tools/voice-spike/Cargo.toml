[package]
name = "voice-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[lib]
name = "voice_spike"
path = "src/lib.rs"

[[bin]]
name = "voice-spike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
pitch_shift = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signalsmith-stretch = "0.1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
