name: Desktop quality
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d "$LIBCLANG_PATH" || {
            echo "缺少 libclang：默认变声特性需要 C++ 工具链与 libclang，请安装 LLVM 并设置 LIBCLANG_PATH" >&2
            exit 1
          }
      - name: Verify libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path $env:LIBCLANG_PATH)) {
            throw "缺少 libclang：默认变声特性需要 C++ 工具链与 libclang，请安装 LLVM 并设置 LIBCLANG_PATH"
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Voice backend tests (audio-core)
        run: cargo test --locked -p audio-core --features voice
      - name: Voice backend tests (audio-session)
        run: cargo test --locked -p audio-session --features voice
      - run: node --check apps/mixer-gui/dist/main.js
      - run: node --check apps/mixer-gui/dist/theme.js
      - run: node --check crates/remote/src/control-page.js
      - run: node --test tools/test-gui-model.js tools/test-gui-controls.js tools/test-remote-controls.js tools/test-app-packaging.js
      - name: Windows smoke harness regression
        if: runner.os == 'Windows'
        shell: powershell
        run: .\apps\mixer-gui\build-app-windows.ps1 -TestSmokeHarness
