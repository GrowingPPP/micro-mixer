[package]
name = "mixer-gui"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audio-core = { path = "../../crates/audio-core" }
audio-session = { path = "../../crates/audio-session" }
backend-cpal = { path = "../../crates/backend-cpal" }
hotkeys = { path = "../../crates/hotkeys" }
app-config = { path = "../../crates/app-config" }
remote = { path = "../../crates/remote" }
selftest = { path = "../../crates/selftest" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
rfd = "0.15"

[features]
# 默认启用变声；关闭后仍可编译，运行期对变声请求返回明确错误。
default = ["voice"]
voice = ["audio-session/voice"]

[dev-dependencies]
# 宿主生命周期回归注入不注册系统热键的管理器替身。
hotkeys = { path = "../../crates/hotkeys", features = ["test-support"] }

[lints]
workspace = true
