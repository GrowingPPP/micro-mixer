[package]
name = "mixer-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mixer"
path = "src/main.rs"

[dependencies]
audio-core = { path = "../../crates/audio-core" }
audio-session = { path = "../../crates/audio-session" }
backend-cpal = { path = "../../crates/backend-cpal" }
hotkeys = { path = "../../crates/hotkeys" }
app-config = { path = "../../crates/app-config" }
remote = { path = "../../crates/remote" }
selftest = { path = "../../crates/selftest" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true

[features]
# 默认启用变声，构建需要 C++ 工具链与 libclang；--no-default-features 仍可编译。
# 请求变声却未编译该特性时，运行期给出明确错误而不是静默降级。
default = ["voice"]
voice = ["audio-session/voice"]

[lints]
workspace = true
