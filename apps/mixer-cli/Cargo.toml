[package]
name = "mixer-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mixer"
path = "src/main.rs"

[dependencies]
audio-core = { path = "../../crates/audio-core" }
audio-session = { path = "../../crates/audio-session" }
backend-cpal = { path = "../../crates/backend-cpal" }
hotkeys = { path = "../../crates/hotkeys" }
app-config = { path = "../../crates/app-config" }
remote = { path = "../../crates/remote" }
selftest = { path = "../../crates/selftest" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true

[features]
default = []
# 变声后端需要 C++ 工具链与 libclang；默认构建保持可用，显式启用后才接入
# Signalsmith。请求变声却未编译该特性时，运行期给出明确错误而不是静默降级。
voice = ["audio-session/voice"]

[lints]
workspace = true
