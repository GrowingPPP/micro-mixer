[workspace]
resolver = "2"
members = [
    "crates/audio-core",
    "crates/audio-session",
    "crates/backend-cpal",
    "crates/hotkeys",
    "crates/app-config",
    "crates/remote",
    "crates/selftest",
    "apps/mixer-cli",
    "apps/mixer-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["zhangguanghui <1003986591@qq.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rtrb = "0.3"
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
global-hotkey = "0.8"
symphonia = { version = "0.5", default-features = false, features = [
    # 格式（容器）
    "wav", "isomp4", "ogg", "aiff", "caf", "mkv",
    # 编解码器 —— "pcm" 必须显式开启，否则连 WAV 都解不了
    "pcm", "adpcm", "mp3", "mpa", "aac", "alac", "flac", "vorbis",
] }

# ── 集中式 lint 策略 ──────────────────────────────────────────────
# 各 crate 用 `[lints] workspace = true` 继承，规则只在这里维护一份。
# 项目当前是 **0 告警**状态，改动请保持。
[workspace.lints.rust]
# 2024 edition 会默认开启；提前用上，避免以后迁移时集中爆问题
unsafe_op_in_unsafe_fn = "warn"
# 别让 `let _ = foo()` 悄悄吞掉 Result
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# 手写 FFI 的地方多，把这几条打开
not_unsafe_ptr_arg_deref = "warn"
# 音频回调之类的热路径上，别写出无意义的 clone/alloc
redundant_clone = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# 用 unwind 而不是 abort。
#
# 菜单栏常驻程序最怕的是"悄无声息地死掉" —— 用户正在游戏里，对方突然听不到他，
# 而屏幕上什么提示都没有。abort 会让**任何一处 panic 都直接杀进程**。
#
# 但 unwind 有个前提：**音频回调里必须就地 catch_unwind**。
# cpal 的回调是从 `extern "C" fn` 调过来的，panic 越过 FFI 边界是未定义行为。
# 这一层在 crates/backend-cpal 里做了（见 guard_input / guard_output）。
panic = "unwind"

# 音频引擎必须快 —— 调试构建下也要能跑实时
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
