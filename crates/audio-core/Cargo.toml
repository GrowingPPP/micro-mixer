[package]
name = "audio-core"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
rtrb.workspace = true
symphonia.workspace = true

# 变声后端捆绑 C++ 源码并通过 bindgen 生成绑定，只在启用 voice 特性时编译。
# 应用层（mixer-gui、mixer-cli）默认启用该特性；audio-core 自身默认关闭，
# 便于单独测试不依赖 C++ 的路径，以及无 libclang 环境的交叉检查。
signalsmith-stretch = { version = "0.1.3", optional = true }

[features]
default = []
# C++ 后端只在 voice 特性下编译；旧命令使用的 voice-signalsmith 保留为别名。
voice = ["dep:signalsmith-stretch"]
voice-signalsmith = ["voice"]

[lints]
workspace = true
